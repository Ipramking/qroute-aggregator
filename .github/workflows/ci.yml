name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Compile contracts
        run: npm run compile -w contracts

      - name: Run tests (contracts, routing-engine, arbitrage-bot, relayer)
        run: npm test

      - name: Build frontend
        run: npm run build -w frontend
